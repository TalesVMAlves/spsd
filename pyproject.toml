[project]
name = "spsd"
version = "0.1.0"
description = "São Paulo's Settlement Dataset: setores censitários e favelas de São Paulo (Censo 2022 + GeoSampa) para apoiar detecção em imagens de satélite."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "geopandas>=1.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "requests>=2.31",
    "openpyxl>=3.1",
    "ipykernel>=6.29",
]

[dependency-groups]
dev = [
    "nbconvert>=7.16",
]
