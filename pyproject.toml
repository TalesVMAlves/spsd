[project]
name = "favelas-ibge"
version = "0.1.0"
description = "Lê os arquivos do IBGE (Censo 2022) sobre setores e favelas e plota o município com suas favelas."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "geopandas>=1.0",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "requests>=2.31",
    "openpyxl>=3.1",
    "ipykernel>=6.29",
]

[dependency-groups]
dev = [
    "nbconvert>=7.16",
]
